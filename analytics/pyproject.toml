[project]
name = "stratum-analytics"
version = "0.1.0"
description = "Pure strength & nutrition models for STRATUM (1RM, RPE/RIR, trend, plateau, fatigue)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stratum_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
